[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actiontrack"
version = "0.1.0"
description = "CLI tool that tracks action items from Markdown meeting notes and drafts follow-up emails"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
actiontrack = "actiontrack.cli:app"

[tool.setuptools.packages.find]
include = ["actiontrack*"]
